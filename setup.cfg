[flake8]
max-line-length = 88
exclude =
    .git,
    __pycache__,
    venv,
    .venv,
    _fallback_board.py

ignore =
    E114,
    E116,
    E122,
    E127,
    E303,
    W391,
    F541,
    E,
    W,
    F

[mypy]
exclude = ^venv/,*.py
python_version = 3.12

# Don't require type hints everywhere
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False

# Ignore missing imports
ignore_missing_imports = True

# Reduce strictness
warn_return_any = False
warn_unused_ignores = False
warn_redundant_casts = False
warn_no_return = False
warn_unreachable = False

# Ignore all mypy errors when linting this project
ignore_errors = True

# Ignore errors inside generated fallback file
[mypy-_fallback_board]
ignore_errors = True